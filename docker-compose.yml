services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./app:/app
      - ./conf/spark/spark-defaults.conf:/spark/conf/spark-defaults.conf 
    environment:
      - INIT_DAEMON_STEP=setup_spark
      

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    ports:
      - "9083:9083"
    volumes:
      - ./conf:/opt/hive/conf
    environment:
      - SERVICE_NAME=metastore
    command: >
      bash -c "hive --service metastore"

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    ports:
      - "10000:10000"
      - "10002:10002"
    # volumes:
    #   - ./conf:/opt/hive/conf
    environment:
      - SERVICE_NAME=hiveserver2
      - HIVE_SITE_CONF=/opt/hive/conf
    command: >
      bash -c "hive --service hiveserver2 --hiveconf hive.metastore.uris=thrift://hive-metastore:9083"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
       - kafka_data:/var/lib/kafka/data

  python_consumer:
    container_name: python_consumer
    build:
      context: ./python_consumer
      dockerfile: Dockerfile
    depends_on:
      - kafka
    volumes:
      - ./python_consumer:/app
    

  python_producer:
    container_name: python_producer
    build:
      context: ./python_producer
      dockerfile: Dockerfile
    depends_on:
      - kafka
    volumes:
      - ./python_producer:/app
  flask-api:
    build:
      context: ./api_flask
    container_name: flask-api
    depends_on:
      - namenode
      - datanode
    ports:
      - "5000:5000"
      - "5050:5050"
    volumes:
      - ./api_flask:/app

  front-aggregat:
    build:
      context: ./front-aggregat
    container_name: front-aggregat
    ports:
      - "3000:3000"
    volumes:
      - ./front-aggregat:/app
      - /app/node_modules
    depends_on:
      - flask-api

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
  kafka_data:
